    <script>
      // Render Recommendations
      const recommendationList = document.getElementById("recommendation-list");

      recommendations.forEach((rec, index) => {
        // Automatically generate a quote from the recommendation text
        let quote = rec.recommendation;

        // Limit to 200 characters without cutting words in half
        if (quote.length > 170) {
          // Trim to the nearest space before 200 characters
          quote = quote.substring(0, 170);
          const lastSpaceIndex = quote.lastIndexOf(" ");

          // Ensure we cut off at the last full word
          quote = quote.substring(0, lastSpaceIndex) + "...";
        }

        const recHTML = `
          <div class="col-lg-4 col-md-6 portfolio-item isotope-item filter-recognition">
            <div class="testimonial-item">
              <p>
                <i class="bi bi-quote quote-icon-left"></i>
                <span class="testimonial-text">${quote}</span>
                <i class="bi bi-quote quote-icon-right"></i>
              </p>
              <button class="rc-read-more-btn" data-popup="popup-${index + 1}">Read more</button><br/><br/>
              <div class="profile">
                <img 
                  src="assets/img/recommendation/avatar.png" 
                  data-src="${rec.image}" 
                  class="testimonial-img lazy-img" 
                  alt="Lilan Dayananda recommendation from ${rec.name}" />
                <h3>${rec.name}</h3>
                <h4>${rec.position}</h4>
                <h5>${rec.company}</h5>
              </div>
            </div>
          </div>

          <div id="popup-${index + 1}" class="rc-popup">
            <div class="rc-popup-content">
              <button class="popup-close-btn">&times;</button> 
              <div class="popup-testimonial-item">
                <div class="popup-profile-item">
                  <div>
                  <img 
                    src="assets/img/recommendation/avatar.png" 
                    data-src="${rec.image}" 
                    class="popup-testimonial-img lazy-img" 
                    alt="Lilan Dayananda recommendation from ${rec.name}" />
                  </div>

                  <div class="popup-testimonial-text">
                    <h2>
                      <span>${rec.name}</span>
                      <span> <a href="${
                        rec.linkedin
                      }" target="_blank"><i class="bi bi-linkedin"></i></a></span>
                    </h2>
                    <h3>${rec.position}</h3>
                    <h6>${rec.company}</h6></br>
                    <h4>${rec.relationship}</h4>
                    <h5>${rec.date}</h5>
                    <p>
                      <i class="bi bi-quote quote-icon-left"></i>
                      <span class="testimonial-text">${rec.recommendation.replace(/\n/g, "<br />")}</span>
                      <i class="bi bi-quote quote-icon-right"></i>
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;

        recommendationList.insertAdjacentHTML("beforeend", recHTML);
      });
    </script>

    <script>
      window.addEventListener("load", () => {
        const lazyImages = document.querySelectorAll("img.lazy-img");

        lazyImages.forEach((img) => {
          const actualSrc = img.getAttribute("data-src");
          if (actualSrc) {
            img.src = actualSrc;
            img.removeAttribute("data-src");
          }
        });
      });
